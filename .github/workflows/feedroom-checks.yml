name: Feedroom checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install '.[r2]'
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: node --test tests/cloudflare.test.mjs
      - run: npm exec -- cf build
      - run: feedroom --help
        working-directory: /tmp
      - run: docker compose config --quiet
      - run: docker build -t feedroom:check .
      - run: docker run --rm --network none feedroom:check --help
