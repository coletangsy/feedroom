services:
  feedroom:
    build: .
    environment:
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - THREADS_ACCESS_TOKEN
      - THREADS_ACCOUNT_ID
      - FEEDROOM_R2_ACCOUNT_ID
      - FEEDROOM_R2_BUCKET
      - FEEDROOM_R2_ACCESS_KEY_ID
      - FEEDROOM_R2_SECRET_ACCESS_KEY
    volumes:
      - threads-state:/data

  feedroom-cards:
    image: ${FEEDROOM_CARDS_IMAGE:-${COMPOSE_PROJECT_NAME}-feedroom-cards:latest}
    extends:
      service: feedroom
    profiles: [cards]
    build:
      context: .
      target: cards
    environment:
      - FEEDROOM_MEDIA_R2_ACCOUNT_ID
      - FEEDROOM_MEDIA_R2_BUCKET
      - FEEDROOM_MEDIA_R2_ACCESS_KEY_ID
      - FEEDROOM_MEDIA_R2_SECRET_ACCESS_KEY

volumes:
  threads-state:
