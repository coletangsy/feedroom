[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feedroom"
version = "0.1.0"
description = "Publish a daily Threads digest of sourced AI and data science headlines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["trafilatura>=2,<3"]

[project.optional-dependencies]
r2 = ["boto3>=1.37,<2"]

[project.scripts]
feedroom = "feedroom.cli:main"

[tool.setuptools.packages.find]
include = ["feedroom", "feedroom.prompts"]

[tool.setuptools.package-data]
feedroom = ["prompts/*.md"]
